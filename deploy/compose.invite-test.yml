# Disposable local testing, separate from the deployment Compose projects.
# See docs/testing-invite-only.md. Set the password in your shell first.
name: kallisti-invite-test
services:
  server:
    build: ..
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:64739:64738/tcp"
      - "127.0.0.1:64739:64738/udp"
    environment:
      ALLOWED_ORIGINS: "http://localhost:18080"
      SERVER_NAME: "Invite-only local test"
      MUMBLED_SUPERUSER_PASSWORD: "${MUMBLED_SUPERUSER_PASSWORD:?Set a disposable test password in your shell}"
      FEDI_LOGIN: "0"
      PUSH: "0"
      LINK_PREVIEWS: "0"
      MEDIA_PREVIEWS: "0"
    volumes:
      - data:/data
volumes:
  data:
