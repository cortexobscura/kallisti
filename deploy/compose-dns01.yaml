# Standalone built-in Mumble and Cloudflare DNS-01 variant. Run from the repository root.
# Set DOMAIN in deploy/.env and CLOUDFLARE_API_TOKEN_FILE to an absolute path
# outside the repository containing a scoped Cloudflare token.
name: deploy
services:
  kallisti:
    build: ..
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    ports:
      - "64738:64738/tcp"
      - "64738:64738/udp"
      - "8189:8189/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      ALLOWED_ORIGINS: "https://${DOMAIN:?Set DOMAIN in deploy/.env}"
      TRUST_FORWARDED_FOR: "1"
      TEXT_CHANNELS: "general"
      SERVER_NAME: "${SERVER_NAME:-Kallisti}"
      MUMBLE_WELCOME: "${MUMBLE_WELCOME:-}"
      MUMBLED_SUPERUSER_PASSWORD: "${SUPERUSER_PASSWORD:-}"
      BACKUP_DIR: "/data/backups"
      MUMBLE_CERT_FILE: "${MUMBLE_CERT_FILE:-/data/mumble-tls/current/mumble.crt}"
      MUMBLE_KEY_FILE: "${MUMBLE_KEY_FILE:-/data/mumble-tls/current/mumble.key}"
      WHIP_UDP_PORT: "8189"
      WHIP_PUBLIC_IP: "${WHIP_PUBLIC_IP:-${DOMAIN}}"
    volumes:
      - kallisti-data:/data

  caddy:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.caddy-dns01
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN in deploy/.env}"
    # The token is read at startup, not expanded into the Compose configuration.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        CF_API_TOKEN=$$(cat /run/secrets/cloudflare_api_token)
        if [ -z "$$CF_API_TOKEN" ]; then
          echo "Cloudflare token file is empty" >&2
          exit 1
        fi
        export CF_API_TOKEN
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    secrets:
      - cloudflare_api_token
    volumes:
      - ./Caddyfile.dns01:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp
    depends_on:
      kallisti:
        condition: service_healthy

  cert-sync:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.cert-sync
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN in deploy/.env}"
    volumes:
      - caddy-data:/caddy-data:ro
      - kallisti-data:/app-data
    depends_on:
      - caddy

volumes:
  kallisti-data:
  caddy-data:
  caddy-config:

secrets:
  cloudflare_api_token:
    file: ${CLOUDFLARE_API_TOKEN_FILE:?Set CLOUDFLARE_API_TOKEN_FILE to an absolute path outside the repository}
