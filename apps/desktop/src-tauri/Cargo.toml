[package]
name = "kallisti-desktop"
version = "0.9.3"
license = "Unlicense"
edition = "2021"
description = "Kallisti desktop app"

[lib]
name = "kallisti_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-tungstenite = "0.27"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
url = "2"
rand = "0.9"
hex = "0.4"
sha2 = "0.10"
serde_json = "1"
aes = "0.8"
webpki-roots = "1"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

# Desktop only: push-to-talk while the app is in the background.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# Linux: the WebView's media settings and permission requests (see
# media.rs). The version wry uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
# Notifications over D-Bus (see notify.rs). The version the plugin uses.
zbus = "5"

# macOS: no App Nap (see background.rs). The version tauri uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }

[dev-dependencies]
rcgen = "0.14"
